[package]
name = "mock_swap"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
# See dex_aggregator/Cargo.toml: cosmwasm-schema 2.x avoids the cw-schema
# `Schemaifier` bound that injective 0.3.6 types don't implement.
cosmwasm-schema    = { version = "2.2.2" }
cosmwasm-std       = { version = "3.0", features = [
    "cosmwasm_1_2",
    "cosmwasm_1_3",
    "cosmwasm_1_4",
    "cosmwasm_2_0",
    "iterator",
    "stargate"
] }
cw-storage-plus    = { version = "3.0" }

injective-cosmwasm  = { version = "0.3.6" }
injective-math      = { version = "0.3.6" }

schemars           = { version = "0.8.22" }
serde              = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json         = { version = "1.0.140" }
serde_repr         = { version = "0.1.20" }
hex                = { version = "0.4.3" }

[dev-dependencies]
injective-test-tube = { version = "1.19.0" }
