[package]
name = "mock_clmm_flash"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
# Match mock_swap's stack (cosmwasm-schema 2.x avoids the cw-schema Schemaifier
# bound; cosmwasm-std 3.0 to match the aggregator workspace).
cosmwasm-schema = { version = "2.2.2" }
cosmwasm-std = { version = "3.0", features = [
    "cosmwasm_1_2",
    "cosmwasm_1_3",
    "cosmwasm_1_4",
    "cosmwasm_2_0",
    "iterator",
    "stargate",
] }
cw-storage-plus = { version = "3.0" }
schemars = { version = "0.8.22" }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
