[package]
name = "dex_aggregator"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cw2                = { version = "3.0.0" }
# cosmwasm-schema stays on 2.x: its 3.0 `#[cw_serde]` derives the new cw-schema
# `Schemaifier`, which injective-cosmwasm/injective-math 0.3.6 types (JsonSchema-
# only) do not implement. 2.2.2 has no cosmwasm-std dep, so it coexists cleanly
# with cosmwasm-std 3.0 and keeps the JsonSchema-only derive the injective stack expects.
cosmwasm-schema    = { version = "2.2.2" }
cosmwasm-std       = { version = "3.0", features = [
    "cosmwasm_1_2",
    "cosmwasm_1_3",
    "cosmwasm_1_4",
    "cosmwasm_2_0",
    "iterator",
    "stargate"
] }
cw-storage-plus    = { version = "3.0" }

injective-cosmwasm  = { version = "0.3.6" }
injective-math      = { version = "0.3.6" }
injective-std       = { version = "1.19.0" }
prost               = { version = "0.13" }

schemars           = { version = "0.8.22" }
serde              = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json         = { version = "1.0.140" }
serde_repr         = { version = "0.1.20" }

thiserror         = { version = "2.0.12" }

hex               = { version = "0.4.3" }

[dev-dependencies]
injective-test-tube = { version = "1.19.0" }
mock_swap = { path = "../mock_swap" }
mock_clmm_flash = { path = "../mock_clmm_flash" }

[[test]]
name = "integration"
path = "../../tests/integration.rs"
harness = true
